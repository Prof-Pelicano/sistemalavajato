{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm mt-4">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">
                    {% if object %}Editar Serviço{% else %}Novo Serviço{% endif %}
                </h4>
            </div>
            <div class="card-body">
                <form method="post">                    
                    {% csrf_token %}                    
                    
                    {{ form.as_p }}
                    
                    <div class="d-flex justify-content-end mt-4">
                        <a href="{% url 'servico_list' %}" class="btn btn-secondary me-2">Cancelar</a>
                        <button type="submit" class="btn btn-success">Salvar Serviço</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
