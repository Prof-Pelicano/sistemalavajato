{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">Confirmar Exclusão</h4>
            </div>
            <div class="card-body text-center">
                <p class="lead mt-3">
                    Você tem certeza que deseja excluir o cliente <strong>{{ object.nome }}</strong>?
                </p>
                <p class="text-muted">
                    Atenção: Esta ação não poderá ser desfeita. 
                </p>
                
                <form method="post" class="mt-4 mb-2">
                    {% csrf_token %}
                    <a href="{% url 'pessoafisica_list' %}" class="btn btn-secondary me-2">Cancelar e Voltar</a>
                    <button type="submit" class="btn btn-danger">Sim, Excluir Cliente</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
